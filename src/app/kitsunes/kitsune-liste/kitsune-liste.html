<h1>Les Kitsune</h1>

<ul class="liste">
  @for (kitsune of kitsunes(); track kitsune.nom) {
    <li>
      <a class="carte" [class.booste]="kitsune.boost" [routerLink]="['/kitsunes', kitsune.nom]">
        @if (imageDe(kitsune.nom); as image) {
          <span class="cadre">
            <img class="illustration" [src]="image" [alt]="kitsune.nom" />
          </span>
        }
        <span class="infos">
          <span class="nom">{{ kitsune.nom }}</span>
          <span class="etat" [class.en-repos]="kitsune.enRepos">
            {{ kitsune.enRepos ? 'En repos' : 'Disponible' }}
          </span>
        </span>
      </a>
    </li>
  } @empty {
    <li class="vide">Aucun Kitsune pour le moment.</li>
  }
</ul>
